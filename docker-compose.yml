services:
  postgres-db:
    image: postgres:16-alpine
    container_name: reminderapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reminderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reminder-network

  redis:
    image: redis:7-alpine
    container_name: reminder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - reminder-network

  api:
    build:
      context: .
      dockerfile: ReminderApp.Api/Dockerfile
    container_name: reminderapp-api
    restart: unless-stopped
    depends_on:
      - postgres-db
      - redis
    ports:
      - "5154:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=reminderdb;Username=postgres;Password=password!
      - ConnectionStrings__Redis=reminder-redis:6379
    volumes:
      - api_uploads:/app/wwwroot/uploads
    networks:
      - reminder-network

  frontend:
    build:
      context: ./reminder-client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5154/api
    container_name: reminderapp-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - reminder-network

volumes:
  postgres_data:
  api_uploads:

networks:
  reminder-network:
    driver: bridge